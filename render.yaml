# Render Blueprint - deploys the full stack in one command:
#   https://dashboard.render.com/blueprints -> New Blueprint Instance,
#   point it at this repo, Render reads this file automatically.
#
# Just one web service + a managed Postgres now that auth-service and
# notification-service have been folded into analytics-service (JWT
# validation happens locally against Supabase's secret; notifications and
# reports are in-process calls, not network hops). This is what makes free
# hosting realistic at all: Render's free instance type only covers web
# services, Postgres, and Key Value - private services and background
# workers require a paid instance per service, which the old 4-service
# (auth/analytics/notification/gateway) topology would have needed.
#
# Secrets marked `sync: false` are never written here - Render prompts for
# them once in its dashboard when the blueprint is first applied.

databases:
  - name: audienceinsights-db
    databaseName: audienceinsights
    user: audience
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: analytics-service
    env: docker
    dockerContext: ./backend/analytics-service
    dockerfilePath: ./backend/analytics-service/Dockerfile
    plan: free
    # Without this, Render defaults to checking "/" - which this app has no
    # controller for (404), causing Render to consider every deploy
    # unhealthy even though the service is actually up.
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: audienceinsights-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: audienceinsights-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: audienceinsights-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: audienceinsights-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: audienceinsights-db
          property: password
      # From your Supabase project: Project Settings -> API -> JWT Settings
      # ("Legacy JWT Secret"). Identity itself is delegated to Supabase Auth;
      # this is only used to verify the JWT it issues.
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: OAUTH_STATE_SECRET
        generateValue: true
      - key: SUPABASE_WEBHOOK_SECRET
        sync: false
      # Comma-separated allow-list for whichever origin(s) the frontend is
      # actually served from in production (a web build, if any - React
      # Native/Expo's native HTTP client doesn't send an Origin header, so
      # this mainly matters for a web target). Defaults to
      # http://localhost:3000 if left unset, which is wrong for production.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Push notifications (Firebase Cloud Messaging) - optional. Both
      # sync:false (not a fixed blueprint value) so switching this on in
      # the Render dashboard sticks across future blueprint re-syncs,
      # instead of being silently reset back to a hardcoded default. Enter
      # "false" here to keep in-app notifications working without push;
      # see README.md "Enabling push notifications (FCM)".
      - key: FIREBASE_ENABLED
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_BASE64
        sync: false
      # Real platform OAuth integrations - all optional. Leave unset (stays
      # false / blank) to keep that platform on mock data; see README.md's
      # "Real <Platform> Integration" sections before enabling one for real.
      - key: YOUTUBE_INTEGRATION_ENABLED
        value: false
      - key: YOUTUBE_CLIENT_ID
        sync: false
      - key: YOUTUBE_CLIENT_SECRET
        sync: false
      - key: SPOTIFY_INTEGRATION_ENABLED
        value: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: INSTAGRAM_INTEGRATION_ENABLED
        value: false
      - key: INSTAGRAM_CLIENT_ID
        sync: false
      - key: INSTAGRAM_CLIENT_SECRET
        sync: false
      - key: TIKTOK_INTEGRATION_ENABLED
        value: false
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_INTEGRATION_ENABLED
        value: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
