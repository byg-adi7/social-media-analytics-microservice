server:
  port: ${SERVER_PORT:8003}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:audienceinsights}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

# Central Auth Service, used to validate every user-facing request's JWT -
# this service performs no local authentication.
auth-service:
  url: ${AUTH_SERVICE_URL:http://localhost:8001}
  validate-token-path: /api/auth/validate

# Analytics Service, used to pull real data when generating a report. The
# caller's own bearer token is forwarded rather than a separate credential.
analytics-service:
  url: ${ANALYTICS_SERVICE_URL:http://localhost:8002}

# Shared secret for the /internal/** endpoints called by other backend
# services (currently just the Analytics Service) with no end-user JWT in
# hand. Must match INTERNAL_API_KEY on the calling service.
internal-api:
  key: ${INTERNAL_API_KEY:dev-only-change-me-in-production}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000
      auth-service:
        connectTimeout: 3000
        readTimeout: 5000
      analytics-service:
        connectTimeout: 5000
        readTimeout: 15000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

logging:
  level:
    root: INFO
    com.platform.notification: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
