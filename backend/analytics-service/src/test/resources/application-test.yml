spring:
  datasource:
    url: jdbc:h2:mem:analytics_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  jackson:
    default-property-inclusion: non_null

auth-service:
  url: http://localhost:9999
  validate-token-path: /api/auth/validate

analytics:
  sync:
    enabled: false
  mock-data:
    enabled: true

youtube:
  enabled: false
  redirect-uri: http://localhost:8082/api/oauth/youtube/callback
  frontend-redirect-uri: http://localhost:3000/dashboard

oauth:
  state-secret: test-secret

logging:
  level:
    root: WARN
