spring:
  datasource:
    url: jdbc:h2:mem:analytics_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      # validate (not create-drop): Flyway's V1 migration creates the
      # schema; this confirms the entity mapping actually matches what
      # Flyway produces, rather than Hibernate silently generating its own
      # schema over it and masking a real mismatch.
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  jackson:
    default-property-inclusion: non_null

auth-service:
  url: http://localhost:9999
  validate-token-path: /api/auth/validate

analytics:
  sync:
    enabled: false
  mock-data:
