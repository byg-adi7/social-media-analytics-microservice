spring.application.name=audience-insights-auth-service

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/audienceinsights}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# Flyway (db/migration) owns the schema now; Hibernate only validates that
# entity mappings match what Flyway created, rather than auto-altering it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.table=flyway_schema_history_auth
# All 3 services share one physical Postgres schema ("public") - by the
# time this one's migrations run, a sibling service may have already
# created its own tables there. Flyway's default safety check refuses to
# migrate into a "non-empty" schema it doesn't recognize; baseline-version=0
# (not the default of 1) ensures baselining still lets V1 itself run,
# rather than treating it as already applied.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

jwt.secret=${JWT_SECRET:dev-only-change-me-in-production-audience-insights-auth}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Real email verification (Gmail SMTP). MAIL_USERNAME/MAIL_PASSWORD are set in
# the root .env - MAIL_PASSWORD must be a Gmail "App Password", not the normal
# account password (requires 2-Step Verification enabled on the Gmail account).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=${MAIL_USERNAME:}
# Used to build the verify-email link sent in that email - must be reachable
# by whoever clicks the link, so the gateway's externally-reachable address,
# not a service-internal one.
app.base-url=${APP_BASE_URL:http://172.24.145.226:8080}

# Actuator auto-adds a mail-connectivity health check once
# spring-boot-starter-mail is on the classpath. With placeholder/misconfigured
# credentials (expected until real ones are supplied) that check fails and
# drags the whole service's health status to DOWN, even though every other
# endpoint works fine - email sending already fails gracefully on its own
# (see EmailService), so overall health shouldn't depend on it.
management.health.mail.enabled=false
