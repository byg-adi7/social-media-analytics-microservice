spring.application.name=audience-insights-auth-service

# SPRING_DATASOURCE_URL (set directly by docker-compose.yml) wins when
# present; otherwise built from DB_HOST/DB_PORT/DB_NAME (set by hosts like
# Render, whose managed Postgres exposes host/port/database separately
# rather than a ready-made JDBC URL) - same pattern analytics-service and
# notification-service already use.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:audienceinsights}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}

# Flyway (db/migration) owns the schema now; Hibernate only validates that
# entity mappings match what Flyway created, rather than auto-altering it.
# (No entities remain post-Supabase-migration, but Flyway itself still needs
# this datasource to run its migration history against the shared Postgres.)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.table=flyway_schema_history_auth
# All 3 services share one physical Postgres schema ("public") - by the
# time this one's migrations run, a sibling service may have already
# created its own tables there. Flyway's default safety check refuses to
# migrate into a "non-empty" schema it doesn't recognize; baseline-version=0
# (not the default of 1) ensures baselining still lets V1 itself run,
# rather than treating it as already applied.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Verifies JWTs issued by Supabase Auth - identity itself (register, login,
# password hashing, email verification) is fully delegated to Supabase now;
# this service only checks that a token is genuine.
supabase.jwt-secret=${SUPABASE_JWT_SECRET:dev-only-placeholder-set-real-supabase-jwt-secret-in-env}
