spring.application.name=audience-insights-auth-service

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/audienceinsights}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET:dev-only-change-me-in-production-audience-insights-auth}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
