spring.datasource.url=jdbc:h2:mem:auth_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# validate (not create-drop): Flyway's V1 migration creates the schema;
# this confirms the entity mapping actually matches what Flyway produces,
# rather than Hibernate silently generating its own schema over it and
# masking a real mismatch.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

jwt.secret=test-secret-key-for-auth-service-tests-only
