spring.datasource.url=jdbc:h2:mem:auth_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# validate (not create-drop): Flyway's migrations own the schema (V1-V3,
# ending with no tables left post-Supabase-migration); this confirms nothing
# unexpected is left over, rather than Hibernate silently generating its own
# schema and masking a real mismatch.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

supabase.jwt-secret=test-secret-key-for-auth-service-tests-only
