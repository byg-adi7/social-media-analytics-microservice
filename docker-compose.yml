services:
  postgres:
    image: postgres:14-alpine
    container_name: audienceinsights-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-audience}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env - see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-audienceinsights}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # database/schema.sql is no longer mounted here: analytics-service
      # manages its tables via Flyway (db/migration) from its JPA entities,
      # which have diverged from that static seed script (UUID PKs, richer
      # per-platform OAuth columns). Kept in the repo for historical
      # reference only - see database/schema.sql's header comment.
    networks:
      - audienceinsights-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-audience}"]
      interval: 10s
      timeout: 5s
      retries: 5
  analytics-service:
    build:
      context: ./backend/analytics-service
      dockerfile: Dockerfile
    container_name: analytics-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-audienceinsights}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-audience}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env - see .env.example}
      SERVER_PORT: 8002
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:?Set SUPABASE_JWT_SECRET in .env - see .env.example}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET:?Set OAUTH_STATE_SECRET in .env - see .env.example}
      SUPABASE_WEBHOOK_SECRET: ${SUPABASE_WEBHOOK_SECRET:?Set SUPABASE_WEBHOOK_SECRET in .env - see .env.example}
      FIREBASE_ENABLED: ${FIREBASE_ENABLED:-false}
      FIREBASE_SERVICE_ACCOUNT_BASE64: ${FIREBASE_SERVICE_ACCOUNT_BASE64:-}
      FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH:-}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_CAPACITY: ${RATE_LIMIT_CAPACITY:-120}
      RATE_LIMIT_REFILL_PERIOD_SECONDS: ${RATE_LIMIT_REFILL_PERIOD_SECONDS:-60}
      # Real platform OAuth credentials - all optional. Any left unset keep
      # that platform's integration disabled and served from mock data (see
      # README's "Enabling real platform integrations" section).
      YOUTUBE_INTEGRATION_ENABLED: ${YOUTUBE_INTEGRATION_ENABLED:-false}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      SPOTIFY_INTEGRATION_ENABLED: ${SPOTIFY_INTEGRATION_ENABLED:-false}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      INSTAGRAM_INTEGRATION_ENABLED: ${INSTAGRAM_INTEGRATION_ENABLED:-false}
      INSTAGRAM_CLIENT_ID: ${INSTAGRAM_CLIENT_ID:-}
      INSTAGRAM_CLIENT_SECRET: ${INSTAGRAM_CLIENT_SECRET:-}
      TIKTOK_INTEGRATION_ENABLED: ${TIKTOK_INTEGRATION_ENABLED:-false}
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      FACEBOOK_INTEGRATION_ENABLED: ${FACEBOOK_INTEGRATION_ENABLED:-false}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
    ports:
      # Host port kept at 8080 (what the frontend, scripts, and README
      # already point at) even though nginx is gone - this is now the only
      # backend service, so there's nothing left for a gateway to route
      # between.
      - "8080:8002"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - audienceinsights-network
networks:
  audienceinsights-network:
    driver: bridge
volumes:
  postgres_data:
