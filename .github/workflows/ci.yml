name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit tests (analytics-service)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/analytics-service/pom.xml

      - name: Run tests
        working-directory: backend/analytics-service
        run: mvn -B test

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-analytics-service
          path: backend/analytics-service/target/surefire-reports

  integration-smoke-test:
    name: Cross-service integration smoke test
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Generate ephemeral secrets for this CI run
        # Never real secrets, never committed - freshly generated per run
        # and discarded when the runner is torn down. docker-compose.yml
        # refuses to start without these being set at all (see its
        # ${VAR:?message} substitutions), so this is required, not optional.
        run: |
          {
            echo "POSTGRES_USER=audience"
            echo "POSTGRES_PASSWORD=$(openssl rand -base64 32)"
            echo "POSTGRES_DB=audienceinsights"
            echo "SUPABASE_JWT_SECRET=$(openssl rand -base64 32)"
            echo "OAUTH_STATE_SECRET=$(openssl rand -base64 32)"
            echo "USER_DELETION_WEBHOOK_SECRET=$(openssl rand -base64 32)"
          } > .env

      - name: Build and start the full stack
        run: docker compose up --build -d

      - name: Wait for all services to report healthy
        run: |
          for i in $(seq 1 60); do
            STATUSES=$(docker compose ps --format '{{.Health}}' | grep -v '^$' || true)
            UNHEALTHY=$(echo "$STATUSES" | grep -vc '^healthy$' || true)
            TOTAL=$(echo "$STATUSES" | wc -l)
            if [ "$TOTAL" -gt 0 ] && [ "$UNHEALTHY" -eq 0 ]; then
              echo "All $TOTAL health-checked services are healthy."
              exit 0
            fi
            echo "Waiting for services to become healthy ($i/60)..."
            sleep 5
          done
          echo "Services did not become healthy in time."
          docker compose ps
          exit 1

      - name: Run the smoke test
        run: |
          SUPABASE_JWT_SECRET=$(grep '^SUPABASE_JWT_SECRET=' .env | cut -d= -f2-)
          BASE_URL=http://localhost:8080 SUPABASE_JWT_SECRET="$SUPABASE_JWT_SECRET" bash scripts/smoke-test.sh

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
